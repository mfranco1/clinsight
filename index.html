<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%BRAND_NAME%</title>
    <link rel="icon" type="image/svg+xml" href="%BRAND_ICON%" />
    <style>
      .app-bootstrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #475569;
        font:
          500 14px Inter,
          system-ui,
          sans-serif;
      }
      .app-bootstrap__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .app-bootstrap__logo {
        width: 45px;
        height: 48px;
      }
      .app-bootstrap__bar {
        position: relative;
        width: 192px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: #e2e8f0;
      }
      .app-bootstrap__bar::before {
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: #0d9488;
        content: "";
        animation: app-bootstrap-loading 1.4s ease-in-out infinite;
      }
      @keyframes app-bootstrap-loading {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-bootstrap__bar::before {
          animation: none;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
  </head>
  <body>
    <div id="root">
      <main class="app-bootstrap" role="status" aria-live="polite">
        <div class="app-bootstrap__content">
          %BRAND_BOOTSTRAP_MARK%
          <span class="app-bootstrap__bar" aria-hidden="true"></span>
          <span>%BRAND_LOADING%</span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
