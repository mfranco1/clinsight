<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%BRAND_NAME%</title>
    <link rel="icon" type="image/svg+xml" href="%BRAND_ICON%" />
    <style>
      .app-bootstrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #475569;
        font:
          500 14px Inter,
          system-ui,
          sans-serif;
      }
      .app-bootstrap__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .app-bootstrap__logo {
        width: 45px;
        height: 48px;
      }
      .app-bootstrap__spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #0d9488;
        border-top-color: transparent;
        border-radius: 50%;
        animation: app-bootstrap-spin 0.8s linear infinite;
      }
      @keyframes app-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-bootstrap__spinner {
          animation: none;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
  </head>
  <body>
    <div id="root">
      <main class="app-bootstrap" role="status" aria-live="polite">
        <div class="app-bootstrap__content">
          %BRAND_BOOTSTRAP_MARK%
          <span class="app-bootstrap__spinner" aria-hidden="true"></span>
          <span>%BRAND_LOADING%</span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
